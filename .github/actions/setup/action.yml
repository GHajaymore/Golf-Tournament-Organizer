name: Set up the app
description: Node, dependencies, a generated Prisma client and a migrated database.

# The four steps every job in ci.yml needs before it can do anything useful.
#
# They were one copy when `verify` was a single job. Splitting that job into
# parallel ones would have made them three copies, and three copies of a
# database setup is how two of them quietly drift from the third — so they live
# here instead and each job says `uses: ./.github/actions/setup`.
#
# `actions/checkout` is deliberately NOT here: a local composite action cannot
# run until the repository containing it has been checked out, so every job has
# to do that itself first.

inputs:
  node-version:
    # 20 for the app and every test. The mutation ratchet's part asks for 22: StrykerJS 10
    # refuses to start on anything older ("requires version to match >=22.0.0"), which is how
    # the first nightly with it (2026-11-01) reported no scores at all.
    description: The Node.js version to set up
    required: false
    default: "20"

  database-host:
    # Set ONLY by a job that runs in Playwright's container image: the name of its Postgres
    # service (`postgres`). Such a job cannot reach the service on localhost, and every script
    # that touches the database refuses a host that is not localhost, so this forwards
    # localhost:5432 to the service (scripts/ci/forward-postgres.mjs) before anything uses it.
    description: The Postgres service's name when the job runs in a container, else empty
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Reach the database on localhost (container jobs only)
      if: ${{ inputs.database-host != '' }}
      shell: bash
      env:
        # Through the environment, never spliced into the script text.
        DATABASE_HOST: ${{ inputs.database-host }}
      run: |
        # The checkout may belong to another user than the one the container runs as.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        nohup node scripts/ci/forward-postgres.mjs "$DATABASE_HOST" 5432 > "$RUNNER_TEMP/forward-postgres.log" 2>&1 &
        for i in $(seq 1 70); do
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then cat "$RUNNER_TEMP/forward-postgres.log"; exit 0; fi
          sleep 1
        done
        cat "$RUNNER_TEMP/forward-postgres.log"
        echo "::error::localhost:5432 never reached the $DATABASE_HOST service (a machine fault, re-run the job)."
        exit 1

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install
      shell: bash
      run: npm ci

    - name: Generate Prisma client
      shell: bash
      run: npx prisma generate

    - name: Apply migrations
      # Catches a migration that does not apply to an empty database — the
      # failure mode a local machine never sees, because its database already
      # has every earlier migration in it.
      shell: bash
      run: npx prisma migrate deploy
