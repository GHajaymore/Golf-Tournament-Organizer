name: CI

# Typecheck, test and — the point of this file — actually build.
#
# `next build` shares .next with `next dev`, so building on a machine that has
# the dev server running corrupts it. That has meant the production build was
# effectively never verified locally: every change shipped on the strength of
# tsc and vitest, neither of which sees a server/client boundary violation, a
# bad "use server" export shape, or a static-generation failure.
#
# CI has no dev server, so it can just build. Free on a public repository.
#
# ── WHY THIS IS FOUR JOBS AND NOT ONE ──────────────────────────────────────
#
# It was one job, and it took about nine and a half minutes, of which the
# end-to-end run was six. Everything else — typecheck, unit tests, the audit
# suite, the build, the smoke pass — sat behind it in a queue for no reason
# other than that they were written in the same list. A typecheck error took
# nine minutes to report because Playwright had to finish first.
#
# The three now run beside each other, so the wall clock is the SLOWEST of
# them rather than the sum. `verify` survives as a job that does nothing but
# wait on all three: it is the check name the "main must be green" ruleset
# requires, and renaming it would silently un-protect the branch. That is a
# repository setting rather than a file, so this file bends to it.
#
# It costs more runner-minutes — three `npm ci` runs rather than one — and
# those are free on a public repository. Wall clock is the thing anyone is
# actually waiting for.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless — on a FEATURE branch.
#
# Never on `main`. Deploys now come from the `deploy` job below rather than
# Vercel's own Git integration, so a cancelled run on `main` no longer means a
# deploy with no verdict — but it still means a merge commit whose only record
# reads `cancelled`, which is unreadable six weeks later when somebody is
# trying to work out what was verified.
#
# Note this protects a run that has STARTED, not one still queued: GitHub
# allows one running and one pending run per group, and a third arrival
# cancels the pending one regardless of this setting. Merging a batch will
# still leave most of them cancelled. Merge one at a time when the history has
# to mean something.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job needs the same database wiring. Hoisted here so the three cannot
# disagree about which URL means what.
env:
  # Local to the runner and destroyed with it — never a real credential.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourneyhq_ci
  # schema.prisma reads `url = env("PRISMA_DATABASE_URL")` and only `directUrl`
  # from DATABASE_URL. The migrate steps use the direct one so they were fine,
  # but anything that actually QUERIES — the smoke server, the end-to-end run —
  # needs this one or every page 500s with "Environment variable not found".
  PRISMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourneyhq_ci
  # A shadow database has to be empty — Prisma replays every migration into it
  # from scratch. Pointing it at the migrated one silently reports no drift,
  # whatever the schema says.
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourneyhq_shadow
  ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  # Keeps the build from trying to phone home during static generation.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Fast feedback: the things that fail most often and cost the least ─────
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Prisma needs a reachable database to generate against, and the audit
      # suite queries one. A throwaway container is cheaper and more honest
      # than pointing CI at a real one.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourneyhq_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Only in this job — the drift check needs its own empty shadow database
      # and there is no reason to build one three times.
      - name: Create shadow database
        run: |
          echo 'CREATE DATABASE tourneyhq_shadow;' > /tmp/shadow.sql
          npx prisma db execute --url "$ADMIN_DATABASE_URL" --file /tmp/shadow.sql

      - name: Check for schema drift
        # Drift means schema.prisma was edited without the matching migration,
        # so the next deploy applies a different database than the one CI
        # tested.
        #
        # This used to run BEFORE the migrations were applied, and its comment
        # said that was the point. It was not: `migrate diff` compares the
        # migrations FOLDER against schema.prisma, replaying the former into
        # the empty shadow database. It never reads the real one, so the state
        # of the real one cannot affect the answer. Running it after `setup`
        # is what lets the whole job share one install.
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Moved here from nowhere: `next lint` was in the documented local gate
        # but had never been in CI at all, so a lint error only failed on the
        # machine of whoever remembered to run it. It caught a real one the day
        # this job was written — a const used above its own declaration, which
        # tsc passes and the build refuses.
        run: npx next lint

      - name: Test
        run: npx vitest run

      - name: Test against real rows
        # The default config EXCLUDES *.audit.test.ts, so authorization,
        # handicap resolution and money were proved only by whoever remembered
        # to run them locally. CI already has a migrated Postgres beside it,
        # which is the only thing they need — they were left out because the
        # config split is invisible from here, not because they cannot run.
        run: npx vitest run --config vitest.audit.config.ts

  # ── Does it build, and does every screen actually render? ─────────────────
  build:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourneyhq_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Smoke-test every route
        # Building proves the app compiles; it does not prove a single screen
        # renders. A server component that reads a const above its own
        # declaration typechecks, builds, and throws on every request — which
        # shipped once, and because saving a score revalidates the layout, it
        # broke score entry across the whole app. This starts the built server
        # and asks each route for a page.
        env:
          AUTH_SECRET: ci-smoke-secret
          SMOKE_BASE_URL: http://localhost:3000
        run: |
          npm start &
          SERVER_PID=$!
          # Poll rather than sleep a fixed amount: too short is a flaky red
          # build, too long is wasted on every push forever.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$SMOKE_BASE_URL"; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before it began serving."; exit 1
            fi
            sleep 2
          done
          node scripts/smoke-routes.mjs
          STATUS=$?
          # The smoke test proves every screen renders; this proves the round
          # configuration controls are still on the ones that need them, and
          # still absent from the ones that don't. Runs against the same
          # server so it costs one boot, not two.
          if [ "$STATUS" -eq 0 ]; then
            node scripts/verify-round-controls.mjs
            STATUS=$?
          fi
          # And this proves the drafting panel is on the announcements screen
          # and still promises, on the page itself, that it sends nothing.
          if [ "$STATUS" -eq 0 ]; then
            node scripts/verify-drafting.mjs
            STATUS=$?
          fi
          # And this seeds two real weeks and checks the movement column says
          # somebody climbed exactly when they did. The arithmetic has unit
          # tests; this proves it survives the trip to the screen.
          if [ "$STATUS" -eq 0 ]; then
            node scripts/verify-week-view.mjs
            STATUS=$?
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS

  # ── The slowest one, and the only net that sees a laid-out page ───────────
  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    # It installs a browser and builds a bundle of its own before it runs a
    # single test.
    timeout-minutes: 30

    # ── ONE VIEWPORT PER JOB ────────────────────────────────────────────────
    #
    # After the four-job split, `e2e` WAS the whole critical path: 386s while
    # everything else finished in about 140. It ran all three viewports in one
    # process, one after another, because `playwright.config.ts` pins
    # `workers: 1` — the three share one seeded fixture and three of the six
    # spec files write to it, so parallel workers inside one run would race.
    #
    # That constraint is real and this does not touch it. Each leg here is a
    # SEPARATE `playwright test` invocation with its own PostgreSQL service,
    # its own `globalSetup` seed and its own teardown — so the files inside a
    # leg still run serially, in the same order, against a fixture nothing else
    # can reach. The parallelism is between processes that share nothing,
    # rather than between tests that share a database.
    #
    # This was blocked by a belief that a single-project run could not stand on
    # its own — that `--project=desktop` alone turned CI red. Measured before
    # relying on it: 78 passed, 12 skipped, nothing failed, so whatever that
    # was, it is not true now. If a leg ever does go red alone while the other
    # two pass, the cause is an order dependency BETWEEN viewports, and that is
    # a bug in the test rather than a reason to put them back in one process.
    #
    # `fail-fast: false` because the whole point of three viewports is the
    # difference between them: a phone failure that cancels the desktop leg
    # hides half of what the run was for.
    strategy:
      fail-fast: false
      matrix:
        project: [phone, small-phone, desktop]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourneyhq_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The browser download is about a minute of every run and changes only
      # when Playwright's version does — so it is keyed on the resolved version
      # in the lockfile rather than on the lockfile itself, which changes for
      # every unrelated dependency bump.
      - name: Work out the Playwright version
        id: pw
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        # All three projects are Chromium (Pixel 5 twice and Desktop Chrome),
        # so there is no reason to download Firefox and WebKit as well.
        #
        # `--with-deps` installs system libraries OUTSIDE the cached directory,
        # so it has to run even on a cache hit — but with the browser already
        # present it is seconds rather than a download.
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        # The one net that was NOT here, and it rotted for eleven days as a
        # result: twelve tests were red and nothing said so, because the suite
        # only ran when somebody remembered. It exists for the class of bug
        # the unit tests structurally cannot see — a scorecard wider than its
        # column, a target under the touch minimum, a card that opens blank
        # over a round already played — all of which shipped green once.
        #
        # It builds its own bundle into .next-e2e (see playwright.config.ts),
        # which is why this job does not run `npm run build` first.
        env:
          AUTH_SECRET: ci-e2e-secret
        run: npx playwright test --project=${{ matrix.project }}

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Named per viewport: three legs uploading one name is an upload
          # collision, and the survivor is whichever finished last rather than
          # the one that failed.
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── The gate ─────────────────────────────────────────────────────────────
  #
  # Does nothing. Exists because "verify" is the check name the branch ruleset
  # requires, and because a single required check is easier to reason about
  # than three — adding a fourth job later needs a line here rather than a
  # change to a repository setting somebody has to remember exists.
  #
  # `needs` fails this job if ANY of the three fails or is cancelled, which is
  # the behaviour the old single job had for free.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [unit, build, e2e]
    timeout-minutes: 5
    steps:
      - name: Everything passed
        run: echo "unit, build and e2e are green."

  # Production ships from HERE, and only after `verify` has gone green.
  #
  # It used to ship from Vercel's own Git integration, on push, without waiting
  # for this file — so a bad commit on `main` was REPORTED by CI rather than
  # stopped by it. On 2026-09-03 twenty-seven merges each deployed before their
  # own checks had finished. Nothing went wrong; nothing was preventing it
  # either.
  #
  # `vercel.json` turns that automatic deploy off for `main`, and this job
  # replaces it. The two arrived in the same commit on purpose: apart, there is
  # a window where `main` deploys twice or not at all.
  deploy:
    name: Deploy to production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Identifiers, not credentials — they name which project to deploy, and
      # the token is scoped to that one project so it cannot infer them.
      VERCEL_ORG_ID: team_du2Cf2nXyLU3G2Dju8DZUYg8
      VERCEL_PROJECT_ID: prj_wGD4aR7UauZ1NXVWpEMDl27bWgog
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the Vercel CLI
        run: npm i -g vercel@latest

      # Links the project and proves the credentials work before anything is
      # uploaded, so a bad token fails in two seconds rather than after a build.
      - name: Link the project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # VERCEL BUILDS IT. This job does not, and must not.
      #
      # The first version built here and uploaded with `--prebuilt`, on the
      # reasoning that shipping the exact artifact CI judged beats shipping a
      # second build of the same source. That reasoning is sound in general and
      # wrong for this repository, because `vercel-build` is
      #
      #     pad-migration-names && deploy-migrations && next build
      #
      # — it runs `prisma migrate deploy` against the PRODUCTION database. To
      # build here, this runner would need production database credentials, and
      # would then migrate production from a GitHub runner. Neither is something
      # to arrange casually, and the failure that exposed it was Vercel
      # correctly refusing to hand `vercel pull` a sensitive value.
      #
      # So the source is uploaded and Vercel builds it, exactly as before this
      # gate existed. What the gate changes is WHEN: only after `verify` is
      # green, rather than on push regardless.
      - name: Deploy
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
