name: iOS — build & upload to TestFlight

# Manual trigger only: this ships a real build to App Store Connect, not
# something that should fire on every push. Run from the Actions tab.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   IOS_DIST_CERT_P12_BASE64   - Distribution certificate, exported as .p12, base64-encoded
#                                 (macOS: `base64 -i cert.p12 | pbcopy`)
#   IOS_DIST_CERT_PASSWORD     - Password for that .p12
#   IOS_PROVISION_PROFILE_BASE64 - App Store provisioning profile for com.flights.tournament,
#                                 base64-encoded (`base64 -i profile.mobileprovision | pbcopy`)
#   IOS_TEAM_ID                - Your Apple Developer Team ID (App Store Connect -> Membership)
#   ASC_API_KEY_ID             - App Store Connect API key ID
#   ASC_API_ISSUER_ID          - App Store Connect API issuer ID
#   ASC_API_KEY_BASE64          - The API key's .p8 file contents, base64-encoded
#
# One-time setup on your end before this can succeed (App Store Connect):
#   1. Register the app with bundle ID com.flights.tournament.
#   2. Create a distribution certificate + an App Store provisioning profile for it.
#   3. Create an App Store Connect API key (Users and Access -> Integrations -> App
#      Store Connect API) with at least "App Manager" access, download the .p8 once.
#
# This has not been run against real credentials yet (no Mac available to test
# locally) — expect to iterate on this file once you see real CI logs.

on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE_DIR/profile.mobileprovision"

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Write export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/App.ipa" \
            -t ios \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_ISSUER_ID }}"
