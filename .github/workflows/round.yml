name: Round

# A WHOLE ROUND OF TESTING, ITS PARTS SIDE BY SIDE.
#
# ci.yml answers "did this change break something" on every push, on one
# browser. A ROUND answers a different question — "is this app sound, all
# over" — and it is asked before function or core changes reach production,
# and three times running before a release (docs/testing.md).
#
# On one machine a round is about six hours: every layer in
# scripts/qa/layers.mjs, one after another, against one database. Nothing in a
# layer depends on another, so here each PART gets a machine and a database of
# its own, all of them drawing ONE build, and the round takes as long as its
# slowest part. Ajay, 2026-10-13: "make the testing efficient."
#
#   plan      reads the parts out of layers.mjs — the list is never kept here
#   build     the database suite, then one production build, handed to every part
#   part      one per part: scripts/qa/round.mjs with that part's arguments
#   verdict   scripts/qa/merge.mjs adds them up, by the same rules a one-machine
#             round is judged by, and writes the table as this run's summary
#
# HOW TO ASK FOR ONE
#   `npm run qa:changed` prints the exact branches a change needs. Push them:
#   round/<anything>-1 (and -2, -3 when it says three). The plan job reads the
#   changed files with the same function (`roundPlan` in layers.mjs), so a core
#   change's round visits all six countries and a change that touches no input
#   screen leaves the console crawl out — without anybody choosing.
#   Or "Run workflow", with the plan given by hand.
#
# THREE KINDS OF ROUND (the panel, 2026-10-23 — docs/testing-panel-2026-10-23.md):
#   pr        a pushed round/** branch: the round a change asks for before it merges
#   nightly   nightly.yml calls this file at 02:00 UTC on main: every pr layer, all
#             six countries, the console crawl in full, the Android tablet and the
#             libraries' published holes. A core change reaches production only
#             after one of these is clean on a commit containing it (deploy.yml).
#   weekly    weekly.yml calls it on Sundays: Chrome and Edge as installed, the
#             front door with its animation on
#
# A verdict is CLEAN, NOT CLEAN, CLEAN BUT NOT ALL OVER, or INCOMPLETE — re-run:
# a part the MACHINE did not run (the browser not installed, the build not
# downloaded, the runner lost) is not a finding about the app. Each part writes
# what its setup steps did (`job-status.json`) so the verdict can tell, and the
# waiter (round-waiter.yml) re-runs the failed jobs of an INCOMPLETE round, up to
# three attempts.
#
# A round is evidence; whoever reads the verdict decides (and records it:
# `npm run qa:status`). It is not a required check.
#
# WHAT IT IS NOT: a phone in a hand, the App Store or Google Play build, or
# Safari and Firefox on a Mac or on Windows. Every browser here is its Linux
# build. The summary says so each time.
#
# WHY THE PARTS DO NOT RUN IN PLAYWRIGHT'S OWN CONTAINER IMAGE (measured against
# the docs 2026-10-23, and kept as the packages job below): a container job
# reaches its Postgres service by the service's NAME, not localhost — and
# `scripts/seed-club.mjs` refuses any database host that is not localhost, on
# purpose (a seed pointed elsewhere cannot be undone). GitHub refuses `--network`
# in a job container's options, so the service cannot be put on localhost; the
# only ways round that are a TCP forwarder started inside every part or
# loosening the guard, and neither is clean. The image also lacks the installed
# Chrome and Edge two layers drive, `lsof` (round.mjs stops its server with it)
# and `sudo`, and runs Firefox as root. The packages job keeps the mirror out of
# all but one job instead, and can no longer fail a round (continue-on-error,
# with its own twenty-minute limit — the same change as #923).

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Which round of a count: 1, 2 or 3 (with countries 'trio', decides the three visited)"
        required: true
        default: "1"
      schedule:
        description: "pr, nightly or weekly"
        required: true
        default: "pr"
      countries:
        description: "trio (the three the round number picks), all (all six), or auto (from the changed files)"
        required: true
        default: "auto"
      crawl:
        description: "on, off, or auto (from the changed files)"
        required: true
        default: "auto"
  workflow_call:
    inputs:
      round:
        type: string
        default: "1"
      schedule:
        type: string
        default: "nightly"
      countries:
        type: string
        default: "all"
      crawl:
        type: string
        default: "on"
  push:
    branches: ["round/**"]

concurrency:
  # The schedule is in the name: the nightly and the weekly both run on main and
  # must not cancel each other.
  group: round-${{ github.ref }}-${{ inputs.schedule || 'pr' }}
  cancel-in-progress: true

env:
  # Local to each runner and destroyed with it — never a real credential.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourneyhq_ci
  PRISMA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tourneyhq_ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      round: ${{ steps.plan.outputs.round }}
      tag: ${{ steps.plan.outputs.tag }}
      planargs: ${{ steps.plan.outputs.planargs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the changed files can be read against main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the parts of a round
        id: plan
        env:
          ASKED: ${{ inputs.round }}
          SCHEDULE_ASKED: ${{ inputs.schedule }}
          COUNTRIES_ASKED: ${{ inputs.countries }}
          CRAWL_ASKED: ${{ inputs.crawl }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          ROUND="$ASKED"
          if [ -z "$ROUND" ]; then ROUND=$(echo "$REF" | grep -oE '[0-9]+$' || true); fi
          if [ -z "$ROUND" ]; then ROUND=1; fi
          SCHEDULE="${SCHEDULE_ASKED:-pr}"
          COUNTRIES="${COUNTRIES_ASKED:-auto}"
          CRAWL="${CRAWL_ASKED:-auto}"
          # The nightly is the full round, whatever it is asked: all six, the crawl in full.
          if [ "$SCHEDULE" = "nightly" ]; then COUNTRIES=all; CRAWL=on; fi
          if [ "$COUNTRIES" = "auto" ] || [ "$CRAWL" = "auto" ]; then
            # What the change touches, read by the same function `npm run qa:changed` prints from.
            node scripts/qa/what-changed.mjs origin/main --json > change-plan.json
            echo "The change, as qa:changed reads it: $(cat change-plan.json)"
            if [ "$COUNTRIES" = "auto" ]; then COUNTRIES=$(node -p "require('./change-plan.json').countries"); fi
            if [ "$CRAWL" = "auto" ]; then CRAWL=$(node -p "require('./change-plan.json').crawl ? 'on' : 'off'"); fi
          fi
          ARGS="--schedule=$SCHEDULE --countries=$COUNTRIES"
          if [ "$CRAWL" = "off" ]; then ARGS="$ARGS --no-crawl"; fi
          SUFFIX=""
          if [ "$SCHEDULE" != "pr" ]; then SUFFIX="-$SCHEDULE"; fi
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          echo "tag=G${RUN}-${ROUND}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "planargs=$ARGS" >> "$GITHUB_OUTPUT"
          echo "parts=$(node scripts/qa/round.mjs --parts --round=$ROUND $ARGS)" >> "$GITHUB_OUTPUT"
          echo "### Round $ROUND: $ARGS" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Database suite and the one build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourneyhq_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The database suite, then the build every part will run
        run: node scripts/qa/round.mjs build --build --build-only
      - name: Hand the build on
        uses: actions/upload-artifact@v4
        with:
          name: build
          # Without the compiler's cache: it is most of the size and no part compiles.
          path: |
            .next-e2e
            !.next-e2e/cache
          include-hidden-files: true
          retention-days: 3
      - name: Keep the logs if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .qa/rounds/build/
          include-hidden-files: true
          retention-days: 7

  browser-packages:
    # THE SYSTEM PACKAGES THE BROWSERS NEED, FETCHED ONCE FOR THE WHOLE ROUND.
    # `playwright install --with-deps` takes them from Ubuntu's mirror, and on
    # 2026-10-23 that mirror served each part at about 40 KB/s: 26 MB of fonts
    # and libraries per part, thirty parts, and three rounds in a row failed
    # every part that drives a browser before a single test ran. So one job
    # fetches them, beside the build and as slowly as it must, and every part
    # takes them from this run's artifacts instead of the mirror. If this job
    # fails, the parts still run and fetch from the mirror as before.
    name: The packages the browsers need
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A shortcut cannot fail a round. On 2026-10-23 this job hit its time limit on a crawling
    # mirror while all 47 parts passed by fetching for themselves, and the run still read
    # "failure", so a re-run of its failed jobs re-ran every part that depends on this one: the
    # whole round again. A job that runs out of time is CANCELLED, which continue-on-error does not
    # cover, so the slow step carries its own limit and gives up as a failed step: the job ends
    # green, and the parts — which wait on it — wait twenty minutes at most.
    # (The same change as claude/textbox-crawl, #923; whichever merges second keeps one copy.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (the Playwright of this branch, nothing else run)
        run: npm ci --ignore-scripts
      - name: Fetch every package the three engines need
        timeout-minutes: 20
        continue-on-error: true
        run: |
          # apt-get keeps what it downloads in its cache unless told not to;
          # say so, so the runner's own settings cannot empty it.
          printf 'APT::Keep-Downloaded-Packages "true";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/80-round-keep
          npx playwright install-deps chromium firefox webkit
          mkdir -p browser-packages
          cp /var/cache/apt/archives/*.deb browser-packages/ 2>/dev/null || true
          COUNT=$(ls browser-packages/*.deb 2>/dev/null | wc -l)
          echo "Kept $COUNT packages ($(du -sh browser-packages | cut -f1))."
          if [ "$COUNT" -eq 0 ]; then echo "::warning::No packages were kept; every part will fetch from the mirror."; fi
      - name: Hand them on
        uses: actions/upload-artifact@v4
        with:
          name: browser-packages
          path: browser-packages/
          retention-days: 1
          if-no-files-found: ignore

  part:
    name: ${{ matrix.part.id }}
    needs: [plan, build, browser-packages]
    # The packages job is a shortcut, not a gate: without it a part fetches
    # from the mirror as it always did.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # A part that fails says so on its own line and stops nothing: the point of
    # a round is everything it found, not the first thing.
    strategy:
      fail-fast: false
      # EIGHT PARTS AT A TIME, so a round never starves a production deploy
      # (docs/release-strategy.md, step 9). The free plan runs about twenty
      # jobs at once; on 2026-10-19 two rounds of ~30 parts each held every
      # runner and main's deploy sat queued for an hour behind them. Two rounds
      # at eight each leave room for CI and the deploy job.
      max-parallel: 8
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tourneyhq_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      # Every step a failure of which is the MACHINE's has an id, and "Say what ran" writes their
      # outcomes down: see scripts/qa/infra.mjs for which steps those are and why only those.
      - id: setup
        uses: ./.github/actions/setup
      - name: Take the build
        id: build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next-e2e
      - name: Take the packages the browsers need
        if: matrix.part.browsers != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: browser-packages
          path: browser-packages
      - name: Install the browser this part drives
        id: browser
        # A part with no browser (the dependency check) installs none: with no
        # name given, this command would fetch all of them.
        if: matrix.part.browsers != ''
        # The apt step behind --with-deps has hung for half an hour before, and
        # on 2026-10-23, with a dozen rounds queued, one hung attempt failed a
        # dozen parts that had not run a single test. A hang is now one attempt
        # of three, each held to four minutes, and only three hangs in a row
        # fail the part — which still says so, in the same words, before any test.
        #
        # The packages come from the job above when it kept them, so apt finds
        # them in its cache and fetches nothing. And a cut-off attempt leaves
        # apt running with the lock held, which failed the first version of
        # these retries in a second each: the next attempt now WAITS for it.
        timeout-minutes: 14
        run: |
          printf 'DPkg::Lock::Timeout "300";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80-round-wait
          if ls browser-packages/*.deb >/dev/null 2>&1; then
            sudo cp browser-packages/*.deb /var/cache/apt/archives/
            echo "Took $(ls browser-packages/*.deb | wc -l) packages from this round's packages job."
          fi
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps ${{ matrix.part.browsers }}; then exit 0; fi
            echo "::warning::Installing the browser did not finish (attempt $attempt of 3); trying again."
            sleep 15
          done
          echo "::error::The browser this part drives could not be installed in three attempts."
          exit 1
      - name: ${{ matrix.part.id }}
        id: run
        run: node scripts/qa/round.mjs ${{ needs.plan.outputs.tag }} --round=${{ needs.plan.outputs.round }} --id=${{ matrix.part.id }} ${{ needs.plan.outputs.planargs }} ${{ matrix.part.args }}
      - name: Say what ran
        # Written whatever happened, so the verdict can tell a part the machine stopped from one the
        # app failed. A part with neither this nor a result was lost with its runner.
        if: always()
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          ID: ${{ matrix.part.id }}
          SETUP: ${{ steps.setup.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          RUN: ${{ steps.run.outcome }}
        run: |
          mkdir -p ".qa/rounds/$TAG"
          printf '{"id":"%s","setup":"%s","build":"%s","browser":"%s","run":"%s"}\n' "$ID" "$SETUP" "$BUILD" "$BROWSER" "$RUN" > ".qa/rounds/$TAG/job-status.json"
          cat ".qa/rounds/$TAG/job-status.json"
      - name: Hand on what it found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part.id }}
          path: |
            .qa/rounds/${{ needs.plan.outputs.tag }}/
            .e2e/coverage/
          include-hidden-files: true
          retention-days: 7
          # A re-run of this part replaces what the attempt before it handed on.
          overwrite: true
      - name: Keep the trace of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.part.id }}
          path: |
            test-results/
            .qa/tmp/
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  verdict:
    name: Verdict
    needs: [plan, build, part]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Take the build (the reach report is read against it)
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next-e2e
      - name: Take every part
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: The run's own clock, for the retro
        # Wall-clock minutes from the run's start, and the runner-minutes of every job so far —
        # read from GitHub, written beside the verdict (scripts/qa/retro.mjs reads them back).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.run_id }} -R ${{ github.repository }} --json createdAt,jobs > run.json
          node -e '
            const r = require("./run.json");
            const min = (a, b) => (Date.parse(b) - Date.parse(a)) / 60000;
            const runner = r.jobs.filter((j) => j.startedAt && j.completedAt && !j.startedAt.startsWith("0001")).reduce((n, j) => n + Math.max(0, min(j.startedAt, j.completedAt)), 0);
            require("fs").writeFileSync("run-facts.json", JSON.stringify({ wallMinutes: Math.round(min(r.createdAt, new Date().toISOString())), runnerMinutes: Math.round(runner) }));
          '
          cat run-facts.json
      - name: Add them up
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # One ledger of what was reached, from every machine's. The files are
          # named by process id, which two machines can share, so each keeps
          # its part's name in front.
          mkdir -p .e2e/coverage
          for dir in parts/*/; do
            id=$(basename "$dir")
            for f in "$dir".e2e/coverage/*.txt; do
              [ -f "$f" ] && cp "$f" ".e2e/coverage/${id}-$(basename "$f")"
            done
          done
          node scripts/e2e-coverage.mjs --json > reach.json || echo '{}' > reach.json
          STATUS=0
          # The plan's own arguments too, so a round whose every machine was lost still gets a
          # verdict (INCOMPLETE) rather than a usage error. Each part's job-status.json is under
          # parts/, and says which of them the machine stopped (scripts/qa/infra.mjs).
          node scripts/qa/merge.mjs "$TAG" $(find parts -name part.json | sort) --expect-parts --reach=reach.json --statuses=parts --run-facts=run-facts.json --round=${{ needs.plan.outputs.round }} ${{ needs.plan.outputs.planargs }} || STATUS=$?
          cat ".qa/rounds/$TAG/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The waiter (round-waiter.yml) reads this to decide whether to re-run the round.
          name: verdict
          path: |
            .qa/rounds/${{ needs.plan.outputs.tag }}/verdict.json
            .qa/rounds/${{ needs.plan.outputs.tag }}/summary.md
            .qa/rounds/${{ needs.plan.outputs.tag }}/retro.json
            reach.json
          include-hidden-files: true
          retention-days: 30
          overwrite: true
